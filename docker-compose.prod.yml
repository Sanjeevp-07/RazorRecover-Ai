version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: razorrecover-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

  postgres:
    image: postgres:16-alpine
    container_name: razorrecover-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: razorrecover-redis-prod
    restart: always

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: razorrecover-api-prod
    restart: always
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: razorrecover-worker-prod
    restart: always
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: razorrecover-web-prod
    restart: always

volumes:
  postgres_prod_data:
