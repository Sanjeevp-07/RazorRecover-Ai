events {
    worker_connections 1024;
}

http {
    upstream api_server {
        server api:8000;
    }

    upstream web_server {
        server web:3000;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://web_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
